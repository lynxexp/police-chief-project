<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Police Chief Dashboard</title>
    <script>
      // Applied before React mounts (and before first paint) so a stored
      // Dark/Light pick doesn't flash the OS-default theme for a frame --
      // see hooks/theme.ts, which this constant/key must stay in sync with.
      try {
        var t = localStorage.getItem("pc:theme");
        if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
