name: Build and Push Docker Image

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "existing release tag (e.g. v1.0.0)"
        required: true

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log into GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Image
        uses: docker/build-push-action@v6
        with:
          # Repo root, not `docker` -- the Dockerfile's own COPY . /app
          # needs requirements.txt, main.py, and cogs/ from the actual
          # repo root; the docker/ subfolder only holds the Dockerfile
          # itself and its two build-time helpers.
          context: .
          file: docker/Dockerfile
          push: true
          # No linux/arm (32-bit/armv7) -- onnxruntime has never published
          # a wheel for it, on any version, so that platform can never
          # succeed here (confirmed against PyPI's actual file listing).
          # linux/arm64 does have real onnxruntime wheels and builds fine.
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/${{ github.repository_owner }}/bot:latest
            ghcr.io/${{ github.repository_owner }}/bot:${{ github.event.inputs.tag || github.event.release.tag_name }}