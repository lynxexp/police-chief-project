services:
  police-chief-bot:
    # Published by .github/workflows/docker.yml on every release -- `docker
    # compose pull` grabs this instead of building. Requires the ghcr.io/
    # lynxexp/bot package to be set to Public (Package settings -> Danger
    # Zone -> Change visibility); it's private by default until someone
    # flips that, and `pull` will fail with "unauthorized" until then.
    # Prefer building locally instead: docker build -t police-chief-bot:latest
    # -f docker/Dockerfile . -- then change image: above to
    # police-chief-bot:latest (and drop the watchtower label below, since
    # watchtower can only see newer versions of a *pulled* image).
    image: ghcr.io/lynxexp/bot:latest
    container_name: police-chief-bot
    labels:
      # Opt-in, not watchtower's default "watch everything" -- caddy and
      # watchtower itself are untouched. See the watchtower service's own
      # comment for what this buys you and the tradeoff it requires.
      - com.centurylinklabs.watchtower.enable=true
    volumes:
      - /opt/docker/police-chief-bot/db/:/app/db
    restart: unless-stopped
    environment:
      - DISCORD_BOT_TOKEN=<your bot token here>

  police-chief-webapp:
    # Published by .github/workflows/docker-webapp.yml on every release --
    # same deal as the bot image above, including needing the ghcr.io/
    # lynxexp/webapp package set to Public separately (it's a different
    # package). Prefer building locally instead: docker build -t
    # police-chief-webapp:latest -f webapp/Dockerfile . (build from the
    # repo root, not from webapp/ -- see webapp/Dockerfile) -- then change
    # image: below to police-chief-webapp:latest and drop the watchtower
    # label, same reasoning as the bot service.
    image: ghcr.io/lynxexp/webapp:latest
    container_name: police-chief-webapp
    labels:
      - com.centurylinklabs.watchtower.enable=true
    volumes:
      # Same bind mount as police-chief-bot, read+write -- this shared
      # path is the entire cross-process bridge between the two services;
      # no networks: block needed, they never talk to each other directly.
      - /opt/docker/police-chief-bot/db/:/app/db
      # This service's own data (sessions, OAuth tokens) -- separate
      # volume so it isn't wiped by anything touching the bot's db/.
      - /opt/docker/police-chief-bot/webapp-db/:/app/webapp/backend/db
    restart: unless-stopped
    environment:
      - DISCORD_CLIENT_ID=<from the existing Discord app>
      - DISCORD_CLIENT_SECRET=<new OAuth2 client secret, same Discord app>
      - DISCORD_BOT_TOKEN=<same bot token, for the /channels lookup>
      - DISCORD_REDIRECT_URI=http://localhost:3000/api/auth/callback
      - SESSION_SECRET=<generate once, keep stable -- e.g. `openssl rand -base64 32`>
      - TRUST_PROXY=false
      # Same value as watchtower-control's WATCHTOWER_CONTROL_TOKEN below --
      # lets the System Health page's watchtower mode control (Off / Check
      # only / Auto-apply) reach that service. Omit both if you deleted
      # watchtower-control; the web UI just won't show that control.
      - WATCHTOWER_CONTROL_TOKEN=<generate once -- e.g. `openssl rand -base64 32`>
      - WATCHTOWER_CONTROL_URL=http://watchtower-control:8090
    ports:
      # Loopback-only for now: host-reachable, not internet-reachable.
      # See webapp/backend/src/config.ts's trustProxy doc comment for the
      # exact steps to flip this over once a reverse proxy (Caddy) is
      # actually in front of this service.
      - "127.0.0.1:3000:3000"

  # Optional: self-updating bot/webapp containers. Watchtower polls GHCR
  # for newer digests of the two labeled images above and recreates their
  # containers in place when one shows up -- the actual mechanism behind
  # the web dashboard's "why can't Docker just update itself" answer.
  #
  # This needs the host's Docker socket to do that (it has to ask Docker
  # itself to pull and recreate containers, which nothing inside a
  # container can do to itself) -- and that socket is effectively root on
  # this host: anything with access to it can start privileged containers
  # or mount arbitrary host paths. Confining it to this single,
  # single-purpose, well-established image (rather than giving the
  # socket to police-chief-webapp directly) keeps that exposure isolated
  # to a container that does nothing else.
  #
  # Delete this service entirely if you'd rather not accept that
  # tradeoff -- both containers keep working fine without it, you'll
  # just be back to updating manually (git pull && docker compose pull
  # && docker compose up -d).
  watchtower:
    # containrrr/watchtower (the original project) was archived
    # 2025-12-17 -- no further releases or security patches. This is
    # nicholas-fedor/watchtower, the actively maintained continuation;
    # same image behavior and env vars, verified against its own current
    # docs before switching. If you're reading this well after the fact,
    # it's worth checking whether that's still the healthiest fork.
    image: ghcr.io/nicholas-fedor/watchtower:latest
    container_name: police-chief-watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      # This fork's bundled Docker client has the same old-API-version
      # default the original project did (seen negotiating as low as
      # 1.25, which current Docker Engine releases refuse outright:
      # "client version ... is too old, minimum supported API version is
      # 1.40"). Pinning this forces a version modern daemons accept;
      # check `docker version --format '{{.Server.APIVersion}}'` on the
      # host if this ever needs bumping again.
      - DOCKER_API_VERSION=1.44
      # Only touches containers carrying the label above -- caddy,
      # watchtower itself, and watchtower-control are never in scope.
      - WATCHTOWER_LABEL_ENABLE=true
      # Matches the bot's own GitHub release-check cadence (6h) so both
      # "is there an update" signals move in step.
      - WATCHTOWER_POLL_INTERVAL=21600
      # Remove the old image after a successful update instead of letting
      # every past version pile up on disk indefinitely.
      - WATCHTOWER_CLEANUP=true
      # WATCHTOWER_MONITOR_ONLY is added/removed here by watchtower-control
      # below, not by hand -- it rewrites this file's running container
      # (not this file itself) when the mode changes. Editing this section
      # directly still works for a one-time manual change, but won't
      # survive the next mode change made through the dashboard.

  # The only thing besides Watchtower itself with Docker socket access.
  # Exists for exactly one reason: env vars can't be changed on a running
  # container, and there's no live "reload config" for Watchtower, so
  # switching it to monitor-only (checks for updates, never applies them)
  # or off genuinely requires recreating it -- something has to hold the
  # socket to do that. See watchtower-control/server.js's own header
  # comment for why there's no docker-socket-proxy narrowing this further
  # (checked: it has no path for container create/remove at all, which is
  # exactly what this needs) and what the real boundary is instead.
  #
  # Delete this service (and WATCHTOWER_CONTROL_TOKEN/_URL above) if you'd
  # rather not accept a second thing holding the socket -- watchtower
  # keeps running exactly as configured above either way, you'll just be
  # back to editing this file by hand to change its mode.
  watchtower-control:
    build:
      context: ./watchtower-control
    container_name: police-chief-watchtower-control
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - watchtower_control_data:/data
    environment:
      # Same value as police-chief-webapp's WATCHTOWER_CONTROL_TOKEN above.
      - WATCHTOWER_CONTROL_TOKEN=<generate once -- e.g. `openssl rand -base64 32`>
volumes:
  watchtower_control_data:
